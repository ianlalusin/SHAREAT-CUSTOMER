# Settings to manage and configure a Firebase App Hosting backend.
# https://firebase.google.com/docs/app-hosting/configure

runConfig:
  # Increase this value if you'd like to automatically spin up
  # more instances in response to increased traffic.
  maxInstances: 1
env:
  - variable: SERVICE_ACCOUNT_KEY_JSON
    secret: FIREBASE_SERVICE_ACCOUNT_KEY
  - variable: CUSTOMER_JOIN_TOKEN_SECRET
    secret: CUSTOMER_JOIN_TOKEN_SECRET
    availability:
      - RUNTIME
  # POS audit B05 (2026-10-29): password hashes live only in
  # customers/{phone}/secrets/auth; the legacy profile field was removed.
  # "off" stops signup and password changes from writing it back.
  - variable: CUSTOMER_SECRETS_LEGACY_FIELD
    value: "off"
    availability:
      - RUNTIME
